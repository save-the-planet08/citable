name: CI

permissions: {}

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: Foundry project
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # The parity tests shell out to Node via ffi, so the JS dependencies must
      # exist before forge test runs.
      - name: Install JS dependencies
        run: npm ci

      - name: Run client library tests
        run: npm test

      - name: Show Forge version
        run: forge --version

      - name: Run Forge fmt
        run: forge fmt --check

      - name: Run Forge build
        run: forge build --sizes

      # Set the SEPOLIA_RPC_URL repository secret to run the ENSv2 fork test here too.
      # Without it the fork test skips itself and the rest still runs.
      - name: Run Forge tests
        env:
          SEPOLIA_RPC_URL: ${{ secrets.SEPOLIA_RPC_URL }}
        run: forge test -vvv
