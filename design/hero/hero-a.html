<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hero A — Das Emblem</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#edeee9; --paper-raised:#f6f7f3; --ink:#16181c; --ink-soft:#5a6067;
  --ink-faint:#8b9098; --rule:#d3d6ce; --rule-strong:#b6bab0; --seal:#1b3a6b;
  --display:"Newsreader",Georgia,serif; --ui:"IBM Plex Sans",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--ui)}
.wrap{max-width:1100px;margin:0 auto;padding:clamp(2rem,6vw,5.5rem) clamp(1.25rem,4vw,3rem)}
.eyebrow{font-size:.6875rem;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-faint);margin:0}

.hero{display:grid;grid-template-columns:1fr;gap:clamp(2.5rem,5vw,4rem);align-items:center}
@media(min-width:900px){.hero{grid-template-columns:1.05fr .95fr}}

h1{font-family:var(--display);font-weight:400;font-size:clamp(1.9rem,4.6vw,3.1rem);line-height:1.12;margin:1.25rem 0 0;letter-spacing:-.01em;text-wrap:balance}
h1 .q{font-style:italic;color:var(--ink-soft)}
h1 .a{display:block;color:var(--seal);margin-top:.2em}
.lede{max-width:34ch;margin:1.6rem 0 0;font-size:.9375rem;line-height:1.65;color:var(--ink-soft)}

/* ---- the emblem ---- */
.emblem{width:100%;max-width:520px;margin-inline:auto}
.emblem svg{width:100%;height:auto;display:block;overflow:visible}
.emblem .stroke{fill:none;stroke:var(--rule-strong);stroke-width:1;stroke-linecap:square}
.emblem .spine{stroke:var(--seal);stroke-width:1.5}
.emblem .leaf{stroke:var(--ink-soft);stroke-width:1.5}
.emblem text{font-family:var(--mono);font-size:8px;fill:var(--ink-faint)}
.emblem .rootbox{fill:var(--seal);stroke:none}
.emblem .rootlabel{fill:var(--seal);font-size:9px;letter-spacing:.08em}

/* draw: dashoffset, no plugin. LCP stays text. */
.draw{stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:draw .75s cubic-bezier(.2,.7,.3,1) forwards;animation-delay:var(--d,0s)}
@keyframes draw{to{stroke-dashoffset:0}}
.fade{opacity:0;animation:fade .5s ease forwards;animation-delay:var(--d,0s)}
@keyframes fade{to{opacity:1}}
.pop{opacity:0;transform:scale(.4);transform-origin:center;animation:pop .5s cubic-bezier(.2,1.3,.4,1) forwards;animation-delay:var(--d,0s)}
@keyframes pop{to{opacity:1;transform:scale(1)}}

.caption{margin-top:1.4rem;display:flex;justify-content:space-between;gap:1rem;border-top:1px solid var(--rule);padding-top:.7rem}
.caption span{font-size:.75rem;color:var(--ink-faint)}
.caption b{font-family:var(--mono);font-weight:500;color:var(--ink-soft)}

@media(prefers-reduced-motion:reduce){
  .draw,.fade,.pop{animation:none;stroke-dashoffset:0;opacity:1;transform:none}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <div>
      <p class="eyebrow">Citable · Register mit Positionsbeweis</p>
      <h1>
        Nicht <span class="q">ist dieses Zitat echt?</span>
        <span class="a">Hier ist der Beweis, dass ich richtig zitiert habe.</span>
      </h1>
      <p class="lede">
        Jeder Absatz wird an seine Position gebunden. Auf der Kette liegen 32 Bytes —
        die Wurzel. Wer zitiert, liefert den Weg dorthin gleich mit.
      </p>
    </div>

    <figure class="emblem" style="margin:0">
      <!-- Seven leaves, paired upward to one root. The object this product is made of. -->
      <svg viewBox="0 0 360 200" role="img" aria-label="Sieben Absätze, paarweise zu einer Wurzel verrechnet">
        <g id="tree"></g>
      </svg>
      <figcaption class="caption">
        <span>Sieben Absätze</span>
        <span>eine Wurzel · <b>0xa2ea6730…</b></span>
      </figcaption>
    </figure>
  </div>
</div>

<script>
// The tree is generated, not drawn by hand: 7 leaves, paired upward. Same shape the
// client library builds, so the emblem is the data structure and not a picture of one.
(function () {
  const NS = "http://www.w3.org/2000/svg";
  const g = document.getElementById("tree");
  const W = 360, LEAF_Y = 178, LEVEL_H = 42, N = 7;
  const pad = 16, span = (W - pad * 2) / (N - 1);

  const el = (name, attrs) => {
    const n = document.createElementNS(NS, name);
    for (const k in attrs) n.setAttribute(k, attrs[k]);
    return n;
  };
  const line = (x1, y1, x2, y2, cls, delay) => {
    const len = Math.hypot(x2 - x1, y2 - y1);
    const l = el("line", { x1, y1, x2, y2, class: "stroke draw " + cls });
    l.style.setProperty("--len", len.toFixed(1));
    l.style.setProperty("--d", delay + "s");
    return l;
  };

  // level 0: the leaves themselves, as ticks
  let nodes = [];
  for (let i = 0; i < N; i++) {
    const x = pad + i * span;
    g.appendChild(line(x, LEAF_Y, x, LEAF_Y - 14, "leaf", 0.05 * i));
    const t = el("text", { x, y: LEAF_Y + 12, "text-anchor": "middle", class: "fade" });
    t.style.setProperty("--d", (0.05 * i) + "s");
    t.textContent = i + 1;
    g.appendChild(t);
    nodes.push({ x, y: LEAF_Y - 14 });
  }

  // pair upward until one remains — an odd node is carried, exactly as the tree does
  let level = 1, delay = 0.45;
  while (nodes.length > 1) {
    const next = [];
    for (let i = 0; i < nodes.length; i += 2) {
      const a = nodes[i], b = nodes[i + 1];
      const y = LEAF_Y - 14 - level * LEVEL_H;
      if (!b) {
        g.appendChild(line(a.x, a.y, a.x, y, "", delay));
        next.push({ x: a.x, y });
        continue;
      }
      const x = (a.x + b.x) / 2;
      g.appendChild(line(a.x, a.y, a.x, y, "", delay));
      g.appendChild(line(b.x, b.y, b.x, y, "", delay));
      g.appendChild(line(a.x, y, b.x, y, nodes.length <= 2 ? "spine" : "", delay + 0.12));
      next.push({ x, y });
    }
    nodes = next;
    level++;
    delay += 0.3;
  }

  // the root
  const r = nodes[0];
  g.appendChild(line(r.x, r.y, r.x, r.y - 18, "spine", delay));
  const box = el("rect", { x: r.x - 5, y: r.y - 28, width: 10, height: 10, class: "rootbox pop" });
  box.style.setProperty("--d", (delay + 0.25) + "s");
  g.appendChild(box);
  const lab = el("text", { x: r.x + 12, y: r.y - 19, class: "rootlabel fade" });
  lab.style.setProperty("--d", (delay + 0.4) + "s");
  lab.textContent = "WURZEL";
  g.appendChild(lab);
})();
</script>
</body>
</html>
